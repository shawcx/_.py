name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install protoc and psql
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client

      - name: Install package
        run: pip install -e '.[test,protobuf,postgres]'

      - name: Test on SQLite and Postgres
        env:
          UNDERSCORE_TEST_POSTGRES: postgresql://test:test@localhost:5432/test
        run: make test
